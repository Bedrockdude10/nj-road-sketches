# Linting, enforced by tests/test_lint.py and CI. A finding is fixed, not ignored, but for one argued below.
target-version = "py313"
line-length = 110
exclude = [".venv", "output", "data", "__pycache__"]

[lint]
select = [
    "F",     # pyflakes - F821 undefined-name is a crash on whatever path reaches it
    "E9",    # syntax / IO errors: a file that does not parse at all
    "B",     # flake8-bugbear: mutable defaults, loop-variable capture
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "RUF",   # ruff's own rules
    "PLW",   # pylint's warnings: redefined loop names, unchecked subprocess
    # Importing another module's _private name: a helper reached from outside is public, and a
    # private reached across modules is how a second copy of a fact gets wired in unseen.
    "PLC2701",
]
preview = true
explicit-preview-rules = true
ignore = [
    # "int() around an already-integer value": ruff infers that from round(), but the values here
    # are often numpy floats, where round() returns np.float64 - and an .osc width would print
    # as 11.0'. The int() is load-bearing.
    "RUF046",
]
