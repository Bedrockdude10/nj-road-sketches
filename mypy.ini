# Type checking, strict, over the modules listed in `files` and nothing else.
#
# The list only grows. All of src/ reports ~326 errors, so strict-everywhere would be a
# migration in its own right; instead a module joins when it is written or substantially
# touched, and from then on a missing annotation fails tests/test_lint.py like any lint finding.
# Imports are followed silently: a strict module is checked against what it calls without the
# callee's own errors being reported here.
[mypy]
python_version = 3.13
files =
    src/sources/osm_change.py
follow_imports = silent
ignore_missing_imports = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
