[pytest]
testpaths = tests
# rootdir on sys.path, so `from src...` and `from tests.conftest import ...` both resolve
# whether pytest is invoked as `pytest` or `python -m pytest`.
pythonpath = .
addopts = -q --strict-markers
markers =
    needs_source_data: mark test as needing GIS data (from data/ or fixtures/data)
filterwarnings =
    ignore::DeprecationWarning:geopandas.*
