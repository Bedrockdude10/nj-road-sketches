# The one place every figure this project draws with is declared, and the schema of what it reads
# from OSM. Code reads figures from here (src/standards.py loads it; Blender reads it with tomllib)
# and nowhere else: a number typed into a module is a second source, and the second source is
# always the one that drifts.
#
# [source.*]   a document a figure comes from.
# [figure.*]   one figure: its value in the unit its source states it in, and
#                status      verified   - read in the source, which is linked
#                            as_cited   - cited and not opened here
#                            local      - a figure Danny set for this project, with the date
#                            modelled   - our own choice; no standard stands behind it
#                            numerical  - not a figure about the street: a step, a tolerance
#              open        set where the figure is not settled - what has to be decided.
# [tag.*]      one OSM key the reader acts on: what it means (its wiki page), whether it is the
#              wiki's or a convention of ours, the figures drawing it uses, and what is drawn when
#              it is absent. A key not listed here is not read.

schema_version = 1

