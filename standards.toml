# --- the OSM keys the reader acts on --------------------------------------------------------------
# convention = "wiki" (the key means what its wiki page says) or "project" (our own key, used
# where OSM has none - each is a candidate for a proposal on the wiki, or for removal).

[tag.width]
wiki = "Key:width"
convention = "wiki"
means = "the carriageway kerb to kerb, parking and cycle lanes included"
absent = "lanes and kerbside features summed, each at its own width figure"
figures = ["lane.width", "default_width.service"]

[tag."width:lanes"]
wiki = "Key:width:lanes"
convention = "wiki"
means = "each lane's width, left to right"
absent = "every lane shares the travel way equally; a two-way way's centre line is where its backward lanes meet its forward ones"

[tag.lanes]
wiki = "Key:lanes"
convention = "wiki"
means = "travel lanes, and with :forward / :backward which way they run"
absent = "no lane lines; no centre line unless overtaking or lane_markings=yes says so"
figures = ["line.width", "line.dash", "line.dash_cycle"]

[tag."change:lanes"]
wiki = "Key:change"
convention = "wiki"
means = "whether traffic may cross from each lane; the line between two lanes is solid where it may not"
absent = "broken lane lines; solid between a turn-only lane and one that is not (MUTCD 3B.04(25))"

[tag."turn:lanes"]
wiki = "Key:turn"
convention = "wiki"
means = "each lane's turn indications, left to right, :backward lanes as their drivers see them; arrows, upstream of the stop line across the lane; a turn-only lane's line solid where change:lanes is absent"
absent = "no arrows"
figures = ["arrow.through_length", "arrow.turn_through_length",
           "arrow.through_outline", "arrow.left_outline", "arrow.clearance", "arrow.search_step"]

[tag.overtaking]
wiki = "Key:overtaking"
convention = "wiki"
means = "with :forward / :backward: a double yellow where no, broken where yes"
absent = "a broken centre line, counted; in one direction, that side of the pair broken"
figures = ["line.width", "line.double_offset", "line.dash", "line.dash_cycle"]

[tag.lane_markings]
wiki = "Key:lane_markings"
convention = "wiki"
means = "no: no lane or centre lines; yes: a centre line even with fewer than 2 lanes"

[tag.placement]
wiki = "Key:placement"
convention = "wiki"
means = "transition: the way's layout eases from the piece before to the piece after"
absent = "the way runs down the middle of its carriageway"
figures = ["speed.default", "taper.speed_break", "taper.low_speed_divisor"]

[tag.maxspeed]
wiki = "Key:maxspeed"
convention = "wiki"
means = "the posted speed: sizes a taper, and the hatch stroke width"
absent = "speed.default"
figures = ["speed.default", "hatch.wide_speed"]

[tag."cycleway:<side>"]
wiki = "Key:cycleway"
convention = "wiki"
means = "lane | track on that side, with :width, :buffer, :oneway, :surface:colour, :separation:* (flex_post | bollard: posts down the buffer)"
absent = "no bike lane"
figures = ["cycleway.width", "bollard.spacing", "bike_lane.symbol_length", "bike_lane.symbol_to_arrow",
           "bike_lane.arrow_length", "bike_lane.symbol_shape", "arrow.through_outline", "arrow.clearance"]

[tag."cycleway:<side>:crossing:markings"]
wiki = "Key:crossing:markings"
convention = "project"
means = "dashes: the lane's green skipped and its edges dotted where traffic crosses it"
figures = ["line.dot"]

[tag."parking:<side>"]
wiki = "Street parking"
convention = "wiki"
means = "lane | street_side | on_kerb | half_on_kerb, with :width, :orientation, :direction, :capacity, :markings"
absent = "no parking drawn"
figures = ["parking.lane_depth", "stall.width", "stall.length", "stall.diagonal_angle", "stall.parallel_length"]

[tag."shoulder:<side>"]
wiki = "Key:shoulder"
convention = "wiki"
means = "a shoulder at that edge, :width wide"
figures = ["default_width.shoulder"]

[tag."shoulder:<side>:markings"]
convention = "project"
means = "hatched: the shoulder hatched from its inner line out to its street's edge as built; OSM has no tag for hatching along a way"
figures = ["hatch.angle", "hatch.spacing", "hatch.stroke_width", "hatch.stroke_width_wide"]

[tag."area:highway"]
wiki = "Key:area:highway"
convention = "wiki"
means = "the street's surface as built; prohibited: painted hatching, not a surface"
absent = "half the way's width either side of it"

[tag.road_marking]
wiki = "Key:road_marking"
convention = "wiki"
means = "stop_line: a bar along the mapped way; restriction: a hatched area in its colour"
figures = ["stop_line.width", "hatch.angle", "hatch.spacing", "hatch.stroke_width", "hatch.stroke_width_wide"]

[tag.median]
convention = "project"
means = "stripes: the way carries a flush median, drawn by the restriction area on it (draft)"

[tag."crossing:markings"]
wiki = "Key:crossing:markings"
convention = "wiki"
means = "lines | dashes | dots: two edge lines; zebra: bars; ladder: both; any other value drawn as zebra and counted"
absent = "zebra where crossing=marked|zebra|uncontrolled, counted; else nothing"
figures = ["default_width.crossing", "crosswalk.line_width", "crosswalk.bar_width"]

[tag."crossing:kerb_extension"]
wiki = "Key:crossing:kerb_extension"
convention = "wiki"
means = "a curb extension on that kerb: the no-standing zone shortens; a proposal paints it and the crosswalk stops at it"
figures = ["no_standing.with_extension", "curb_extension.inset"]

[tag.kerb]
wiki = "Key:kerb"
convention = "wiki"
means = "the kerb's type; its height where kerb:height is absent"
figures = ["kerb.raised", "kerb.rolled", "kerb.lowered", "kerb.ramp", "kerb.flush", "kerb.top_width"]

[tag.tactile_paving]
wiki = "Key:tactile_paving"
convention = "wiki"
means = "yes on a kerb: a detectable warning pad behind it"
figures = ["tactile.depth", "tactile.width"]

[tag.highway]
wiki = "Key:highway"
convention = "wiki"
means = "traffic_signals: a signal pole at each end of its crossings; the road classes are carriageway"
figures = ["signal.clearance"]

[tag.barrier]
wiki = "Key:barrier"
convention = "wiki"
means = "kerb: a kerb way; bollard: a post, and along a way a row of them"
figures = ["bollard.spacing"]

[tag.height]
wiki = "Key:height"
convention = "wiki"
means = "a building's height"
absent = "building:levels at building.level_height each, else building.default_height"
figures = ["building.default_height", "building.level_height"]

[tag.surface]
wiki = "Key:surface"
convention = "wiki"
means = "the material a street, paved ground or path is drawn in: concrete, gravel, dirt, else asphalt"
